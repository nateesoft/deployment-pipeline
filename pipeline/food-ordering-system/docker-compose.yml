version: '3.8'

# food-ordering-system — Next.js Frontend
# Port: ดึงจาก Vault → secret/food-ordering-system/env
# Usage: IMAGE_TAG=x PORT=3333 NEXT_PUBLIC_API_URL=... docker compose up -d

services:
  food-ordering-system:
    image: food-ordering-system:${IMAGE_TAG:-latest}
    container_name: food-ordering-system
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:${PORT:-3333}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3333}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - jenkins-network
      - food-ordering-network

networks:
  jenkins-network:
    external: true
    name: jenkins-network
  food-ordering-network:
    external: true
    name: food-ordering-network
