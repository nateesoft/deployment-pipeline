services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - API_HOST=${API_HOST:-api-service}
      - API_PORT=${API_PORT:-8080}
      - WEB_HOST=${WEB_HOST:-web-service}
      - WEB_PORT=${WEB_PORT:-3000}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: app-network
