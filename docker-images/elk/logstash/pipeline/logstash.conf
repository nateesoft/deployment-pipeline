input {
  beats {
    port => 5044
  }
}

filter {
  # Rename log level field for consistency
  if [level] {
    mutate {
      rename => { "level" => "log_level" }
    }
  }

  # Parse timestamp from log if present
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
      remove_field => [ "timestamp" ]
    }
  }

  # Tag by service name from container label
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }

  # Remove noisy internal fields
  mutate {
    remove_field => [ "@version", "ecs", "host", "agent", "input", "log" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-%{+YYYY.MM.dd}"
  }
}
